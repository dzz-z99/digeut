<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>ㄷ</title>

<meta name="description" content="">
<meta name="author" content="">
<meta property="og:type" content="website">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 18px;
  font: 13px/14.5px Arial, sans-serif;
  color: dimgrey;
  overflow: hidden;
  text-rendering: geometricPrecision;
}

/* Transparent ballpoint layers */

#automatic-ink,
#ink-trail {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  mix-blend-mode: multiply;
}

#automatic-ink {
  z-index: 99998;
}

#ink-trail {
  z-index: 99999;
}

.container {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: -1;
  transform: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.container p {
  position: absolute;
  bottom: 6px;
  left: 18px;
  z-index: 10;
}

.container img {
  position: relative;
  z-index: 1;
  max-height: 72vh;
  cursor: pointer;
  pointer-events: auto;
}

img {
  cursor: pointer;
  user-drag: none;
  -webkit-user-drag: none;
  -khtml-user-drag: none;
  -moz-user-drag: none;
  -o-user-drag: none;
}

a {
  color: black;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

.horizon {
  max-width: 840px;
}

.squarish {
  max-width: 520px;
}

/* Top-left flipping card */

.flip-card {
  width: 270px;
  max-width: calc(100vw - 36px);
  perspective: 1000px;
  position: relative;
  z-index: 77;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.flip-card-inner {
  display: grid;
  transition: transform 0.65s ease;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
}

.flip-card.flipped .flip-card-inner {
  transform: rotateY(180deg);
}

.flip-card-front,
.flip-card-back {
  grid-area: 1 / 1;
  width: 100%;
  height: auto;
  display: block;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.flip-card-back {
  transform: rotateY(180deg);
}

#visible:hover {
  text-decoration: none;
}

@media screen and (max-width: 960px) {
  .container p {
    max-width: calc(100vw - 36px);
    white-space: normal;
    overflow-wrap: break-word;
    word-break: break-word;
    max-height: 40vh;
    overflow-y: auto;
    bottom: 36px;
  }
}
</style>
</head>

<body>

<canvas id="automatic-ink" aria-hidden="true"></canvas>
<canvas id="ink-trail" aria-hidden="true"></canvas>

<!-- Top-left flipping image -->

<div
  class="flip-card"
  id="top-card"
  role="button"
  tabindex="0"
  aria-label="Flip card"
  aria-pressed="false"
>
  <div class="flip-card-inner">
    <img
      class="flip-card-front"
      src="https://upload.wikimedia.org/wikipedia/commons/0/03/%E3%84%B7_%28digeut%29_stroke_order.png?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled"
      alt="Front of card"
    >

    <img
      class="flip-card-back"
      src="http://economybooks.info/daste/digeut.png"
      alt="Back of card"
    >
  </div>
</div>

<br><br>

<a href="mailto:z99zzd@proton.me" target="_blank">
  <img
    src="http://economybooks.info/daste/10.gif"
    alt="Email"
    style="
      max-width: 70px;
      position: relative;
      z-index: 77;
    "
  >
</a>

<!-- Slideshow -->

<div class="container" onclick="plusSlides(1, 0)">
  <div class="thing">
    <img
      class="horizon"
      src="http://economybooks.info/daste/cover1.jpeg"
      alt=""
    >
  </div>

  <div class="thing">
    <img
      class="horizon"
      src="http://economybooks.info/daste/poster1.jpeg"
      alt=""
    >
  </div>

  <div class="thing">
    <img
      class="horizon"
      src="http://economybooks.info/daste/sticker1.png"
      alt=""
    >
  </div>
</div>

<script>
/* Slideshow */

var slideId = ["thing"];
var slideIndex = [0];

document.addEventListener("DOMContentLoaded", function () {
  var slides = document.getElementsByClassName(slideId[0]);

  if (!slides.length) return;

  slideIndex[0] = Math.floor(Math.random() * slides.length) + 1;

  showSlides(slideIndex[0], 0);
});

function plusSlides(n, no) {
  showSlides(slideIndex[no] += n, no);
}

function showSlides(n, no) {
  var slides = document.getElementsByClassName(slideId[no]);

  if (!slides.length) return;

  if (n > slides.length) slideIndex[no] = 1;
  if (n < 1) slideIndex[no] = slides.length;

  for (var i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }

  slides[slideIndex[no] - 1].style.display = "block";
}

/* Flipping card */

var topCard = document.getElementById("top-card");

function flipTopCard() {
  topCard.classList.toggle("flipped");

  topCard.setAttribute(
    "aria-pressed",
    topCard.classList.contains("flipped")
  );
}

topCard.addEventListener("click", function (event) {
  event.stopPropagation();
  flipTopCard();
});

topCard.addEventListener("keydown", function (event) {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    flipTopCard();
  }
});

/* Ballpoint pens */

(function () {
  "use strict";

  var cursorCanvas = document.getElementById("ink-trail");
  var cursorContext = cursorCanvas.getContext("2d");

  var automaticCanvas = document.getElementById("automatic-ink");
  var automaticContext = automaticCanvas.getContext("2d");

  var viewportWidth = window.innerWidth;
  var viewportHeight = window.innerHeight;
  var pixelRatio = 1;

  var points = [];

  var trailLength = 7575;
  var trailLifetime = 19000;

  var fullTurn = Math.PI * 2;

  /*
    AUTOMATIC PEN SETTINGS

    Speed is measured along the line in pixels per second,
    rather than in laps.

    Increase speedMultiplier to make everything faster.
    For example: 1.5 or 2.

    Thickness is independent of speed.
  */

  var speedMultiplier = 1;

  var minimumSpeed = 1800;
  var maximumSpeed = 6500;

  var minimumPenWidth = 1.15;
  var maximumPenWidth = 1.85;

  var edgeMargin = 28;

  var currentSpeed = 3400;
  var targetSpeed = 3400;
  var speedChangeCountdown = 0;
  var speedResponse = 12;

  var angle = Math.random() * fullTurn;
  var elapsed = 0;
  var lastFrameTime = null;
  var previousAutomaticPoint = null;

  var seed = Math.floor(Math.random() * 2147483647);

  function randomBetween(minimum, maximum) {
    return minimum + Math.random() * (maximum - minimum);
  }

  function distanceBetween(a, b) {
    return Math.hypot(b.x - a.x, b.y - a.y);
  }

  /*
    Smooth random noise.

    Unlike a repeating sine-wave pattern, each successive
    section gets new random values, smoothly joined together.
    No growing list of path points is needed.
  */

  function randomValue(index, channel) {
    var value =
      Math.imul(index | 0, 374761393) ^
      Math.imul(channel | 0, 668265263) ^
      seed;

    value = Math.imul(value ^ (value >>> 13), 1274126177);
    value ^= value >>> 16;

    return (value >>> 0) / 4294967295;
  }

  function noise(position, channel) {
    var index = Math.floor(position);
    var fraction = position - index;

    var smooth =
      fraction * fraction * fraction *
      (fraction * (fraction * 6 - 15) + 10);

    var a = randomValue(index, channel);
    var b = randomValue(index + 1, channel);

    return a + (b - a) * smooth;
  }

  function signedNoise(position, channel) {
    return noise(position, channel) * 2 - 1;
  }

  function makePoint(x, y, time, width, automatic) {
    var jitter = automatic ? 0.35 : 0.8;

    return {
      x: x,
      y: y,
      time: time,
      offsetX: (Math.random() - 0.5) * jitter,
      offsetY: (Math.random() - 0.5) * jitter,
      width: width,
      dryness: Math.random(),
      fleck: Math.random() > (automatic ? 0.94 : 0.82),
      fleckX: (Math.random() - 0.5) * 4,
      fleckY: (Math.random() - 0.5) * 4
    };
  }

  /* Shared ballpoint texture */

  function drawInkSegment(context, previous, current, fade) {
    var dryness = current.dryness < 0.13 ? 0.22 : 1;

    var startX = previous.x + previous.offsetX;
    var startY = previous.y + previous.offsetY;
    var endX = current.x + current.offsetX;
    var endY = current.y + current.offsetY;

    var middleX =
      (startX + endX) / 2 +
      (current.dryness - 0.5) * 0.8;

    var middleY =
      (startY + endY) / 2 +
      (0.5 - current.dryness) * 0.8;

    context.lineCap = "round";
    context.lineJoin = "round";

    context.beginPath();
    context.moveTo(startX, startY);
    context.quadraticCurveTo(middleX, middleY, endX, endY);

    context.lineWidth = current.width;
    context.strokeStyle =
      "rgba(54,49,192," + (0.40 * fade * dryness) + ")";

    context.stroke();

    context.beginPath();
    context.moveTo(startX + 0.35, startY - 0.2);

    context.quadraticCurveTo(
      middleX + 0.2,
      middleY - 0.25,
      endX + 0.25,
      endY - 0.15
    );

    context.lineWidth = Math.max(0.35, current.width * 0.38);
    context.strokeStyle =
      "rgba(85,75,216," + (0.22 * fade) + ")";

    context.stroke();

    if (current.fleck) {
      context.beginPath();

      context.arc(
        endX + current.fleckX,
        endY + current.fleckY,
        0.3 + current.dryness * 0.45,
        0,
        fullTurn
      );

      context.fillStyle =
        "rgba(54,49,192," + (0.22 * fade) + ")";

      context.fill();
    }
  }

  /* Original fading cursor trail */

  function trimTrailLength() {
    var totalLength = 0;

    for (var i = points.length - 1; i > 0; i--) {
      var newer = points[i];
      var older = points[i - 1];

      var sectionLength = distanceBetween(newer, older);

      if (totalLength + sectionLength > trailLength) {
        var ratio =
          (trailLength - totalLength) / sectionLength;

        var cutPoint = {
          x: newer.x + (older.x - newer.x) * ratio,
          y: newer.y + (older.y - newer.y) * ratio,
          time: newer.time + (older.time - newer.time) * ratio,
          offsetX: 0,
          offsetY: 0,
          width: newer.width + (older.width - newer.width) * ratio,
          dryness: older.dryness,
          fleck: false,
          fleckX: 0,
          fleckY: 0
        };

        points.splice(0, i, cutPoint);
        break;
      }

      totalLength += sectionLength;
    }
  }

  function addCursorPoint(x, y, time) {
    var previous =
      points.length ? points[points.length - 1] : null;

    if (
      previous &&
      distanceBetween(previous, { x: x, y: y }) < 1.2
    ) {
      return;
    }

    var speed = 0.2;

    if (previous) {
      speed =
        distanceBetween(previous, { x: x, y: y }) /
        Math.max(1, time - previous.time);
    }

    var width =
      Math.max(1.5, Math.min(3.2, 2.8 - speed * 1.1));

    points.push(makePoint(x, y, time, width, false));

    trimTrailLength();
  }

  function drawCursorTrail(time) {
    cursorContext.clearRect(
      0,
      0,
      viewportWidth,
      viewportHeight
    );

    while (
      points.length &&
      time - points[0].time > trailLifetime
    ) {
      points.shift();
    }

    for (var i = 1; i < points.length; i++) {
      var age = (time - points[i].time) / trailLifetime;
      var fade = Math.max(0, 1 - age);

      drawInkSegment(
        cursorContext,
        points[i - 1],
        points[i],
        fade
      );
    }
  }

  window.addEventListener("pointermove", function (event) {
    if (event.pointerType === "touch") return;

    var movements = event.getCoalescedEvents
      ? event.getCoalescedEvents()
      : [];

    if (!movements.length) movements = [event];

    for (var i = 0; i < movements.length; i++) {
      addCursorPoint(
        movements[i].clientX,
        movements[i].clientY,
        movements[i].timeStamp
      );
    }
  }, { passive: true });

  /* Automatic irregular drawing */

  function automaticPosition(a) {
    var margin = Math.min(
      edgeMargin,
      viewportWidth * 0.12,
      viewportHeight * 0.12
    );

    var radiusX = Math.max(
      1,
      viewportWidth / 2 - margin - 5
    );

    var radiusY = Math.max(
      1,
      viewportHeight / 2 - margin - 5
    );

    /*
      Large, unpredictable contractions and expansions,
      with smaller irregularities layered over them.

      The angle is never reset after a lap:
      each new round travels through fresh random terrain.
    */

    var radius =
      0.64 +
      0.20 * signedNoise(a * 0.61, 1) +
      0.10 * signedNoise(a * 1.73, 2) +
      0.035 * signedNoise(a * 4.9, 3) +
      0.012 * signedNoise(a * 13.7, 4);

    /*
      Uneven horizontal and vertical proportions change
      independently, so the loops do not stay concentric.
    */

    var stretchX =
      0.92 + 0.08 * signedNoise(a * 0.83, 5);

    var stretchY =
      0.92 + 0.08 * signedNoise(a * 0.97, 6);

    var handX =
      0.65 * signedNoise(a * 47.3, 7);

    var handY =
      0.65 * signedNoise(a * 51.1, 8);

    return {
      x:
        viewportWidth / 2 +
        Math.cos(a) * radiusX * radius * stretchX +
        handX,

      y:
        viewportHeight / 2 +
        Math.sin(a) * radiusY * radius * stretchY +
        handY
    };
  }

  /*
    Estimate how much physical line a small angular movement
    produces. This lets the pen follow an actual drawing speed,
    including through inward/outward bends.
  */

  function pathRate(a) {
    var epsilon = 0.0001;
    var before = automaticPosition(a - epsilon);
    var after = automaticPosition(a + epsilon);

    return Math.max(
      1,
      distanceBetween(before, after) / (epsilon * 2)
    );
  }

  function updateSpeed(seconds) {
    speedChangeCountdown -= seconds;

    if (speedChangeCountdown <= 0) {
      var choice = Math.random();

      if (choice < 0.28) {
        /* Sudden fast sweep */
        targetSpeed = randomBetween(4800, maximumSpeed);
      } else if (choice < 0.52) {
        /* Brief slower passage, still moving briskly */
        targetSpeed = randomBetween(minimumSpeed, 2800);
      } else {
        targetSpeed = randomBetween(2800, 4800);
      }

      /*
        Both the timing and sharpness of the next
        speed change are randomized.
      */

      speedChangeCountdown = randomBetween(0.10, 0.65);
      speedResponse = randomBetween(7, 24);
    }

    currentSpeed +=
      (targetSpeed - currentSpeed) *
      (1 - Math.exp(-speedResponse * seconds));

    currentSpeed = Math.max(
      minimumSpeed,
      Math.min(maximumSpeed, currentSpeed)
    );
  }

  function advanceAutomaticPen(seconds) {
    var remaining = seconds;

    /*
      Small spatial steps prevent angular corners and
      long straight shortcuts even during very fast sweeps.
    */

    while (remaining > 0.000001) {
      var effectiveSpeed =
        currentSpeed * speedMultiplier;

      var stepTime = Math.min(
        remaining,
        2 / Math.max(1, effectiveSpeed),
        1 / 120
      );

      updateSpeed(stepTime);

      effectiveSpeed = currentSpeed * speedMultiplier;

      var travelDistance = effectiveSpeed * stepTime;

      /*
        Midpoint integration follows the irregular curve
        more evenly than a fixed angular increment.
      */

      var firstRate = pathRate(angle);
      var middleAngle =
        angle + travelDistance / firstRate / 2;

      angle += travelDistance / pathRate(middleAngle);

      elapsed += stepTime;
      remaining -= stepTime;

      var position = automaticPosition(angle);

      /*
        Pressure varies gently along the stroke,
        completely independently of drawing speed.
      */

      var pressure = noise(angle * 3.8, 12);

      var width =
        minimumPenWidth +
        (maximumPenWidth - minimumPenWidth) * pressure;

      var currentPoint = makePoint(
        position.x,
        position.y,
        elapsed * 1000,
        width,
        true
      );

      if (!previousAutomaticPoint) {
        previousAutomaticPoint = currentPoint;
        continue;
      }

      /*
        Wait until there is enough movement to add ink.
        This avoids repeatedly painting the same spot.
      */

      if (
        distanceBetween(previousAutomaticPoint, currentPoint) < 1.4
      ) {
        continue;
      }

      drawInkSegment(
        automaticContext,
        previousAutomaticPoint,
        currentPoint,
        1
      );

      previousAutomaticPoint = currentPoint;
    }
  }

  /* Preserve accumulated ink when the window changes size. */

  function resizeCanvases() {
    var savedInk = document.createElement("canvas");

    savedInk.width = automaticCanvas.width;
    savedInk.height = automaticCanvas.height;

    savedInk.getContext("2d").drawImage(
      automaticCanvas,
      0,
      0
    );

    viewportWidth = window.innerWidth;
    viewportHeight = window.innerHeight;
    pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

    [cursorCanvas, automaticCanvas].forEach(function (canvas) {
      canvas.width =
        Math.round(viewportWidth * pixelRatio);

      canvas.height =
        Math.round(viewportHeight * pixelRatio);

      canvas.style.width = viewportWidth + "px";
      canvas.style.height = viewportHeight + "px";

      canvas.getContext("2d").setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
      );
    });

    if (savedInk.width && savedInk.height) {
      automaticContext.drawImage(
        savedInk,
        0,
        0,
        savedInk.width,
        savedInk.height,
        0,
        0,
        viewportWidth,
        viewportHeight
      );
    }

    var position = automaticPosition(angle);

    previousAutomaticPoint = makePoint(
      position.x,
      position.y,
      elapsed * 1000,
      minimumPenWidth,
      true
    );

    points.length = 0;
  }

  window.addEventListener("resize", resizeCanvases);

  document.addEventListener("visibilitychange", function () {
    lastFrameTime = null;
  });

  function animate(time) {
    if (lastFrameTime === null) {
      lastFrameTime = time;
    }

    /*
      Avoid a huge catch-up stroke after a stalled frame
      or after returning from another browser tab.
    */

    var seconds = Math.min(
      (time - lastFrameTime) / 1000,
      0.05
    );

    lastFrameTime = time;

    if (!document.hidden) {
      advanceAutomaticPen(seconds);
      drawCursorTrail(time);
    }

    requestAnimationFrame(animate);
  }

  resizeCanvases();
  requestAnimationFrame(animate);
})();
</script>

</body>
</html>
